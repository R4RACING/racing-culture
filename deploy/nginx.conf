# 東望洋 · Guia Circuit 静态站 — Nginx 配置
#
# 用法：
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/guia
#   2. 把 server_name 改成你的域名（没有域名就用 IP，可删掉 server_name）
#   3. sudo ln -s /etc/nginx/sites-available/guia /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 用 certbot 一行搞定（会自动改写本文件）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d guia.example.com

server {
    listen 80;
    listen [::]:80;

    # ← 改成你的域名；纯 IP 访问时可以整行删掉
    server_name guia.example.com;

    # ← 站点根目录，和 deploy.sh 里的 REMOTE_DIR 保持一致
    root /var/www/guia;
    index index.html;

    # 字符集
    charset utf-8;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/html text/css application/javascript image/svg+xml application/json;

    # ---------- 安全头 ----------
    # 注意：location 里一旦出现 add_header 就不会继承这里，所以下面只用 expires
    # 来设置缓存，避免覆盖这几个头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 缓存 ----------
    # HTML 不缓存：改完上传立刻生效
    location = /index.html {
        expires -1;
    }

    # 静态资源长缓存：引用处已带 ?v=版本号，更新时改版本号即可
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---------- 路由 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # 隐藏文件（.git / .DS_Store 等）
    location ~ /\. {
        deny all;
        access_log off;
        return 404;
    }
}
